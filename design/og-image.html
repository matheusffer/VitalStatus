<!doctype html>
<!--
  Fonte da imagem de pré-visualização do link (site/og-image.png, 1200x630).
  Para regerar, rode: npm run og
-->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Status Vital — imagem de pré-visualização</title>
<style>
  @font-face { font-family: "Sora"; font-weight: 100 800; src: url("../site/fonts/sora-latin.woff2") format("woff2"); }
  @font-face { font-family: "IBM Plex Sans"; font-weight: 100 700; src: url("../site/fonts/ibm-plex-sans-latin.woff2") format("woff2"); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    background: #0a1110;
    color: #f4f7f6;
    font-family: "IBM Plex Sans", sans-serif;
  }
  .glow { position: absolute; border-radius: 50%; }
  .glow-a { width: 560px; height: 560px; right: -120px; top: -150px;
    background: radial-gradient(circle, rgba(25,195,178,.30) 0%, rgba(25,195,178,0) 65%); }
  .glow-b { width: 520px; height: 520px; left: -160px; bottom: -200px;
    background: radial-gradient(circle, rgba(25,195,178,.16) 0%, rgba(25,195,178,0) 65%); }
  .pill {
    position: absolute; left: 80px; top: 68px; height: 44px; padding: 0 24px 0 20px;
    display: flex; align-items: center; gap: 14px;
    border: 1px solid rgba(25,195,178,.45); border-radius: 22px;
    background: rgba(25,195,178,.10); color: #3fe0cc; font-size: 21px;
  }
  .dot { width: 11px; height: 11px; border-radius: 50%; background: #19c3b2; }
  h1 {
    position: absolute; left: 80px; top: 142px; width: 1040px;
    font-family: "Sora", sans-serif; font-weight: 500; font-size: 76px; line-height: 1.12; letter-spacing: -1.5px;
  }
  h1 span { color: #2ee0cb; display: block; }
  .chips { position: absolute; left: 80px; top: 346px; display: flex; gap: 12px; }
  .chip {
    height: 44px; padding: 0 20px; display: flex; align-items: center;
    border: 1px solid rgba(255,255,255,.14); border-radius: 8px;
    background: rgba(255,255,255,.05); color: #cfd8d6; font-size: 20px;
  }
  .marca { position: absolute; left: 80px; bottom: 66px; display: flex; align-items: center; gap: 20px; }
  .logo {
    width: 54px; height: 54px; border-radius: 14px; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #19c3b2, #12a597); color: #fff;
    font-family: "Sora", sans-serif; font-weight: 500; font-size: 32px;
  }
  .marca b { display: block; font-weight: 500; font-size: 26px; color: #f4f7f6; }
  .marca small { display: block; margin-top: 4px; font-size: 20px; color: #7d8d8a; }
  .cta {
    position: absolute; right: 80px; bottom: 72px; height: 46px; padding: 0 24px;
    display: flex; align-items: center; border: 1px solid rgba(25,195,178,.45); border-radius: 8px;
    background: rgba(25,195,178,.12); color: #3fe0cc; font-size: 22px;
  }
</style>
</head>
<body>
  <div class="glow glow-a"></div>
  <div class="glow glow-b"></div>
  <div class="pill"><span class="dot"></span>Disponibilidade em tempo real</div>
  <h1>Status dos sistemas<span>Vital, ao vivo</span></h1>
  <div class="chips">
    <div class="chip">Vital ERP</div>
    <div class="chip">Vital PDV</div>
    <div class="chip">Vital Talk</div>
    <div class="chip">Via Supply</div>
    <div class="chip">Vendas Ativa</div>
  </div>
  <div class="marca">
    <div class="logo">V</div>
    <div><b>Status Vital</b><small>status.vitalerp.tech</small></div>
  </div>
  <div class="cta">Incidentes e histórico →</div>
</body>
</html>
